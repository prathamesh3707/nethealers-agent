# What the operator wants, in plain words. The planner and safety adviser read these;
# the hard limits that back them up live in policy.yaml and are enforced in code.
- id: protect-hospital
  text: >-
    Protect the hospital zone. Its tower must always keep spare capacity for medical
    and emergency traffic, so do not move extra phones onto it if that would use up
    the spare capacity, even if it would help phones elsewhere.
- id: prefer-reversible
  text: >-
    Prefer small, temporary and reversible changes (beam switches, moving a few phones)
    over changing tower power or tilt, when they help about as much.
- id: harm-none
  text: >-
    Do not trade one group's service for another's. A fix that helps some phones but makes
    several others clearly worse is not acceptable.
- id: humans-decide-big
  text: >-
    Large power or tilt changes, and anything the evidence is unsure about, go to a person
    for approval with a short explanation and the evidence.
- id: privacy
  text: >-
    Use only signal measurements and rough positions. Never use call or message content,
    and never keep location trails longer than needed to fix the problem.
