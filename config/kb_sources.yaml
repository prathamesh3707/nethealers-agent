# Documents in the knowledge base. `kind` says how much weight a passage carries:
#   law             binding (applicable rules and commencement still need checking before use)
#   recommendation  advice from a regulator, not binding
#   guidance        policy principles or frameworks, not binding
#   standard        a technical standard
#   operator        this operator's own policy: the rule-checker enforces it
# `scope` says whose document it is:
#   national  the host country (India): what the agent must follow
#   operator  this operator's policy
#   standard  ITU-T and other technical standards
#   global    examples from other jurisdictions, used for gap analysis only
#   regional  neighbouring countries, used for gap analysis only
# The network agent's safety adviser only cites national, operator and standard passages.
- id: telecom-act-2023
  title: The Telecommunications Act, 2023 (No. 44 of 2023)
  publisher: Government of India
  kind: law
  url: https://egazette.gov.in/WriteReadData/2023/250880.pdf
  scope: national
  country: India
- id: dpdp-act-2023
