[project]
name = "nethealers"
version = "0.1.0"
description = "Self-healing 5G network agent: simplified signal simulator, diagnosis model and agent (NetHealers, ITU AI for Good Build-a-thon 5.0)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pyarrow>=17",
    "scikit-learn>=1.6",
    "torch>=2.5",
    "tabulate>=0.10.0",
    "pyyaml>=6.0.3",
    "openai>=3.24.0",
    "python-dotenv>=1.2.4",
    "pypdf>=6.19.0",
    "psycopg[binary]>=3.3.6",
    "pgvector>=0.5.0",
    "sentence-transformers>=6.1.0",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nethealers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
