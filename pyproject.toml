[project]
name = "nethealers"
version = "0.1.0"
description = "Self-healing 5G network agent: simplified signal simulator, diagnosis model and agent (NetHealers, ITU AI for Good Build-a-thon 5.0)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nethealers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
